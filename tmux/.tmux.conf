# Reload
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Terminal type + true colour.
# tmux-256color has been tmux's own default since 3.2, but pin it so a future
# default change can't silently downgrade the prompt. RGB advertises 24-bit
# colour to programs running inside tmux; without it oh-my-posh's hex colours
# are downsampled to the 256-colour cube. This was live on the running server
# but absent from this file, so it was lost on every tmux server restart.
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"
set -as terminal-features ",xterm*:RGB"

# Basics
set -g mouse on
set -g status-position top
set -g set-clipboard on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top
set -g set-clipboard on

# place tmux custom config here
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

# Theme options 
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# add left/right padding inside the badges
set -g @catppuccin_window_text          " #W "
set -g @catppuccin_window_current_text  " #W "

# Status line
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right " #{E:@catppuccin_status_session}"
set -ag status-right " #{E:@catppuccin_status_uptime}"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


