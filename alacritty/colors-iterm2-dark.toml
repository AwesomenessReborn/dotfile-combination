# Palette — iTerm2 "Default" profile, dark mode.
# Single source of truth for the Alacritty side of that palette; the same colors
# live in ../iterm2/ as .itermcolors (macOS) and kitty-colors.conf.
#
# Colors only — no [font] here, so this file can be swapped without disturbing
# font settings in common.toml.

[colors.primary]
background = "#15191f"
foreground = "#dcdcdc"

[colors.cursor]
text   = "#000000"
cursor = "#ffffff"

[colors.vi_mode_cursor]
text   = "#000000"
cursor = "#b3d7ff"

[colors.selection]
text       = "#000000"
background = "#b3d7ff"

[colors.search.matches]
foreground = "#000000"
background = "#c7c7c7"

[colors.search.focused_match]
foreground = "#000000"
background = "#00c200"

[colors.footer_bar]
foreground = "#000000"
background = "#c7c7c7"

[colors.hints.start]
foreground = "#000000"
background = "#c7c400"

[colors.hints.end]
foreground = "#000000"
background = "#c7c7c7"

[colors.normal]
black   = "#14191e"
red     = "#b43c2a"
green   = "#00c200"
yellow  = "#c7c400"
blue    = "#2744c7"
magenta = "#c040be"
cyan    = "#00c5c7"
white   = "#c7c7c7"

[colors.bright]
black   = "#686868"
red     = "#dd7975"
green   = "#58e790"
yellow  = "#ece100"
blue    = "#a7abf2"
magenta = "#e17ee1"
cyan    = "#60fdff"
white   = "#ffffff"
